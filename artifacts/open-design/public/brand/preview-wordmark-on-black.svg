<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="Bonanza Cr8tives wordmark on black">
  <title>Bonanza Cr8tives — wordmark on black</title>
  <rect width="800" height="500" fill="#0B0B0B"/>
  <!-- Mark: stacked BONANZA / CR8TIVES, white on bz-black ground.
       Centred horizontally, vertically optical-centred. -->
  <g transform="translate(180, 180)" fill="#FFFFFF">
    <text x="0" y="50"
          font-family="'Plus Jakarta Sans', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-weight="800" font-size="80" letter-spacing="2">BONANZA</text>
    <text x="0" y="150"
          font-family="'Plus Jakarta Sans', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-weight="800" font-size="80" letter-spacing="2">CR8TIVES</text>
  </g>
  <!-- Pink accent dot, identity-defining accent only. -->
  <circle cx="180" cy="430" r="6" fill="#5680E9"/>
  <text x="200" y="436"
        font-family="'Plus Jakarta Sans', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
        font-weight="500" font-size="14" letter-spacing="2.5"
        fill="#9A9A9A">WORDMARK · ON BLACK</text>
</svg>
