<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="Bonanza Cr8tives wordmark on primary">
  <title>Bonanza Cr8tives — wordmark on primary blue</title>
  <!-- Renamed in spirit: "on-pink" file path retained for git
       stability, but ground is now Primary Blue per Stage 4 palette. -->
  <rect width="800" height="500" fill="#5680E9"/>
  <g transform="translate(180, 180)" fill="#FFFFFF">
    <text x="0" y="50"
