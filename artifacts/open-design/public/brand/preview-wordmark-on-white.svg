<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="Bonanza Cr8tives wordmark on white">
  <title>Bonanza Cr8tives — wordmark on white</title>
  <rect width="800" height="500" fill="#FFFFFF"/>
  <!-- Mark: stacked BONANZA / CR8TIVES, black on white ground. -->
  <g transform="translate(180, 180)" fill="#0B0B0B">
    <text x="0" y="50"
          font-family="Satoshi, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
          font-weight="900" font-size="80" letter-spacing="2">BONANZA</text>
    <text x="0" y="150"
          font-family="Satoshi, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
          font-weight="900" font-size="80" letter-spacing="2">CR8TIVES</text>
  </g>
  <circle cx="180" cy="430" r="6" fill="#5680E9"/>
  <text x="200" y="436"
        font-family="Satoshi, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
        font-weight="500" font-size="14" letter-spacing="2.5"
        fill="#6B6B6B">WORDMARK · ON WHITE</text>
