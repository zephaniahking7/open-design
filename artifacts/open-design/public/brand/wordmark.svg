<svg xmlns="http://www.w3.org/2000/svg" viewBox="-8 -4 896 224" fill="currentColor" fill-rule="evenodd" role="img" aria-label="Bonanza Cr8tives">
  <title>Bonanza Cr8tives</title>
  <!-- ============================================================
       BONANZA / CR8TIVES — Brixton Hand
       Cap height 100, stem 14, viewBox padded 8u for wedge serifs.
       Row 1 baseline y=100. Row 2 baseline y=210 (leading 110%).
       Filled paths only. Wedge serifs only on B I T A C R Z.
       Human signal: B upper bowl inner offset by 1u (junction).
       ============================================================ -->

  <!-- ===== ROW 1: BONANZA ===== -->

  <!-- B at x=0  (width 42) -->
  <g transform="translate(0,0)">
    <!-- Outer body + counters (evenodd cuts the holes) -->
    <path d="M 0 0 L 24 0 A 25 25 0 0 1 24 50 L 28 50 A 28 28 0 0 1 28 100 L 0 100 Z
             M 14 14 L 22 14 A 11 12 0 0 1 22 36 L 14 36 Z
             M 14 64 L 26 64 A 14 14 0 0 1 26 86 L 14 86 Z"/>
    <!-- Wedge serifs — top-left + bottom-left of stem -->
    <path d="M 0 0 L -7 0 L 0 8 Z"/>
    <path d="M 0 100 L -7 100 L 0 92 Z"/>
  </g>

  <!-- O at x=120  (width 56) — no serifs -->
  <g transform="translate(120,0)">
    <path d="M 28 -2 A 28 52 0 1 0 28 102 A 28 52 0 1 0 28 -2 Z
             M 28 12 A 14 38 0 1 1 28 88 A 14 38 0 1 1 28 12 Z"/>
  </g>

  <!-- N at x=254  (width 56) — no serifs -->
  <g transform="translate(254,0)">
    <path d="M 0 0 L 14 0 L 42 86 L 42 0 L 56 0 L 56 100 L 42 100 L 14 14 L 14 100 L 0 100 Z"/>
  </g>

  <!-- A at x=388  (width 56) — wedge serifs at outer feet -->
  <g transform="translate(388,0)">
    <path d="M 21 0 L 35 0 L 56 100 L 42 100 L 38 80 L 18 80 L 14 100 L 0 100 Z
             M 22 66 L 34 66 L 28 38 Z"/>
    <!-- Wedge serifs at outer feet, facing outward -->
    <path d="M 0 100 L -7 100 L 0 92 Z"/>
    <path d="M 56 100 L 63 100 L 56 92 Z"/>
  </g>

  <!-- N at x=522  (width 56) -->
  <g transform="translate(522,0)">
    <path d="M 0 0 L 14 0 L 42 86 L 42 0 L 56 0 L 56 100 L 42 100 L 14 14 L 14 100 L 0 100 Z"/>
  </g>

  <!-- Z at x=656  (width 46) — wedge serifs at outer corners -->
  <g transform="translate(656,0)">
    <path d="M 0 0 L 46 0 L 46 14 L 18 86 L 46 86 L 46 100 L 0 100 L 0 86 L 28 14 L 0 14 Z"/>
    <!-- Wedge serifs: top-right and bottom-left, facing outward -->
    <path d="M 46 0 L 53 0 L 46 8 Z"/>
    <path d="M 0 100 L -7 100 L 0 92 Z"/>
  </g>

  <!-- A at x=780  (width 56) -->
  <g transform="translate(780,0)">
    <path d="M 21 0 L 35 0 L 56 100 L 42 100 L 38 80 L 18 80 L 14 100 L 0 100 Z
             M 22 66 L 34 66 L 28 38 Z"/>
    <path d="M 0 100 L -7 100 L 0 92 Z"/>
    <path d="M 56 100 L 63 100 L 56 92 Z"/>
  </g>

  <!-- ===== ROW 2: CR8TIVES (baseline y=210, top y=110) ===== -->

  <!-- C at x=0  (width 52) — wedge serifs at terminals into the aperture -->
  <g transform="translate(0,110)">
    <path d="M 52 14 A 26 50 0 1 1 52 86 L 38 86 A 12 36 0 1 0 38 14 Z"/>
    <!-- Top + bottom wedge serifs at the open terminals -->
    <path d="M 52 14 L 52 7 L 44 14 Z"/>
    <path d="M 52 86 L 52 93 L 44 86 Z"/>
  </g>

  <!-- R at x=122  (width 46) — wedge serifs top-left + leg terminal -->
  <g transform="translate(122,110)">
    <path d="M 0 0 L 24 0 A 25 25 0 0 1 24 50 L 18 50 L 46 100 L 30 100 L 14 70 L 14 100 L 0 100 Z
             M 14 14 L 22 14 A 11 12 0 0 1 22 36 L 14 36 Z"/>
    <path d="M 0 0 L -7 0 L 0 8 Z"/>
    <!-- Wedge at leg terminal, facing right -->
    <path d="M 46 100 L 53 100 L 46 92 Z"/>
  </g>

  <!-- 8 at x=238  (width 46) — held bowl, upper light, lower heavy,
       bar with 1u upward curvature at centre. No serifs. -->
  <g transform="translate(238,110)">
    <!-- Upper bowl: stroke ~12, cx=23, cy=22, rx=18 ry=22 -->
    <path d="M 5 22 A 18 22 0 1 1 41 22 A 18 22 0 1 1 5 22 Z
             M 17 22 A 6 11 0 1 0 29 22 A 6 11 0 1 0 17 22 Z"/>
    <!-- Lower bowl: stroke ~15, cx=23, cy=72, rx=23 ry=28 -->
    <path d="M 0 72 A 23 28 0 1 1 46 72 A 23 28 0 1 1 0 72 Z
             M 15 72 A 8 13 0 1 0 31 72 A 8 13 0 1 0 15 72 Z"/>
    <!-- Held bar at junction y=44, with 1u upward curve at centre -->
    <path d="M 11 46 Q 23 43 35 46 L 35 50 Q 23 47 11 50 Z"/>
  </g>

  <!-- T at x=354  (width 50) — wedge serifs at three terminals -->
  <g transform="translate(354,110)">
    <path d="M 0 0 L 50 0 L 50 14 L 32 14 L 32 100 L 18 100 L 18 14 L 0 14 Z"/>
    <!-- Crossbar terminals (downward-facing) + stem foot (left-facing) -->
    <path d="M 0 0 L 0 -7 L 8 0 Z"/>
    <path d="M 50 0 L 50 -7 L 42 0 Z"/>
    <path d="M 18 100 L 11 100 L 18 92 Z"/>
  </g>

  <!-- I at x=474  (width 14) — full 4-wedge serif treatment -->
  <g transform="translate(474,110)">
    <path d="M -7 0 L 21 0 L 14 8 L 14 92 L 21 100 L -7 100 L 0 92 L 0 8 Z"/>
  </g>

  <!-- V at x=558  (width 56) — no serifs, pointed bottom -->
  <g transform="translate(558,110)">
    <path d="M 0 0 L 14 0 L 28 76 L 42 0 L 56 0 L 32 100 L 24 100 Z"/>
  </g>

  <!-- E at x=684  (width 42) — no serifs -->
  <g transform="translate(684,110)">
    <path d="M 0 0 L 42 0 L 42 14 L 14 14 L 14 43 L 36 43 L 36 57 L 14 57 L 14 86 L 42 86 L 42 100 L 0 100 Z"/>
  </g>

  <!-- S at x=796  (width 42) — no serifs, block-construction S -->
  <g transform="translate(796,110)">
    <path d="M 0 0 L 42 0 L 42 14 L 14 14 L 14 43 L 42 43 L 42 100 L 0 100 L 0 86 L 28 86 L 28 57 L 0 57 Z"/>
  </g>
</svg>
